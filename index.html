<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22180f" />
  <title>FMD — Sumy Fantasy Map Experiment</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --ink: #2b2117;
      --paper: #d9c08c;
      --paper-light: #ead9ad;
      --panel: rgba(32, 24, 16, 0.88);
      --gold: #e2be65;
    }
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    #map { background: var(--paper); }
    .maplibregl-canvas { outline: none; }
    .maplibregl-ctrl-attrib { font-family: system-ui, sans-serif; }
    .topbar {
      position: fixed;
      z-index: 5;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 680px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px 10px 16px;
      color: #f4e7c3;
      border: 1px solid rgba(226, 190, 101, 0.55);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
      backdrop-filter: blur(12px);
    }
    .brand { min-width: 0; }
    .brand strong { display: block; font-size: 17px; letter-spacing: .06em; }
    .brand span { display: block; margin-top: 2px; opacity: .72; font: 12px/1.25 system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modes { display: flex; gap: 5px; padding: 4px; background: rgba(255,255,255,.08); border-radius: 12px; }
    .modes button {
      border: 0;
      border-radius: 9px;
      padding: 8px 12px;
      cursor: pointer;
      color: #eadfc6;
      background: transparent;
      font: 600 12px system-ui, sans-serif;
    }
    .modes button.active { color: #20170f; background: var(--gold); }
    .legend {
      position: fixed;
      z-index: 5;
      left: 14px;
      bottom: max(28px, env(safe-area-inset-bottom));
      max-width: min(320px, calc(100vw - 28px));
      padding: 11px 13px;
      border: 1px solid rgba(77, 55, 31, .35);
      border-radius: 12px;
      color: #302316;
      background: rgba(237, 220, 178, .88);
      box-shadow: 0 8px 24px rgba(45, 31, 17, .16);
      backdrop-filter: blur(8px);
      font: 12px/1.45 system-ui, sans-serif;
    }
    .legend b { font-family: Georgia, serif; font-size: 13px; }
    .legend .swatches { display: flex; flex-wrap: wrap; gap: 6px 11px; margin-top: 6px; }
    .legend .item::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: -1px; background: var(--c); }
    .status {
      position: fixed;
      z-index: 6;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: #f5e8c6;
      background: #23180f;
      font: 600 14px system-ui, sans-serif;
      transition: opacity .35s ease;
    }
    .status.hidden { opacity: 0; }
    .error { color: #fff; background: #48251f; padding: 16px 18px; border-radius: 12px; max-width: 84vw; text-align: center; }
    body.fantasy::after {
      content: '';
      position: fixed;
      z-index: 3;
      pointer-events: none;
      inset: 0;
      box-shadow: inset 0 0 90px rgba(54, 34, 15, .42);
      mix-blend-mode: multiply;
    }
    @media (max-width: 620px) {
      .topbar { align-items: stretch; flex-direction: column; }
      .modes button { flex: 1; }
      .legend { font-size: 11px; }
    }
  </style>
</head>
<body class="fantasy">
  <div id="map"></div>
  <header class="topbar">
    <div class="brand">
      <strong>FMD · SUMY</strong>
      <span>Реальная геометрия OSM · участок 2×2 км · VQ88+22F</span>
    </div>
    <div class="modes" role="group" aria-label="Режим карты">
      <button type="button" data-mode="fantasy" class="active">Фэнтези</button>
      <button type="button" data-mode="reality">Реальность</button>
    </div>
  </header>
  <aside class="legend">
    <b>Первый процедурный эксперимент</b>
    <div>Объекты остаются на реальных координатах, меняется только визуальный язык.</div>
    <div class="swatches">
      <span class="item" style="--c:#315438">лес</span>
      <span class="item" style="--c:#79aab2">вода</span>
      <span class="item" style="--c:#c08b4b">дома</span>
      <span class="item" style="--c:#704d2c">дороги</span>
    </div>
  </aside>
  <div id="status" class="status">Загружаю карту Сум…</div>

  <script>
    const CENTER = [34.765046875, 50.8650625];
    const BOUNDS = [[34.75081392347039, 50.85607938825009], [34.77927982652962, 50.874045611749914]];

    const map = new maplibregl.Map({
      container: 'map',
      center: CENTER,
      zoom: 15.2,
      minZoom: 13,
      maxZoom: 19,
      maxBounds: [[34.735, 50.846], [34.795, 50.884]],
      attributionControl: false,
      style: {
        version: 8,
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            maxzoom: 19,
            attribution: '© OpenStreetMap contributors'
          }
        },
        layers: [
          { id: 'paper', type: 'background', paint: { 'background-color': '#dcc38e' } },
          { id: 'osm-reality', type: 'raster', source: 'osm', layout: { visibility: 'none' }, paint: { 'raster-opacity': 1 } }
        ]
      }
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
    map.addControl(new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true,
      fitBoundsOptions: { maxZoom: 17 }
    }), 'bottom-right');
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

    const roadWidth = ['interpolate', ['linear'], ['zoom'], 13, 0.6, 16, 2.5, 19, 7];

    function addFantasyLayers() {
      map.addSource('world', { type: 'geojson', data: './data/map.geojson', promoteId: 'osm_id' });

      map.addLayer({
        id: 'landuse-residential', type: 'fill', source: 'world',
        filter: ['==', ['get', 'kind'], 'residential'],
        paint: { 'fill-color': '#cdb47c', 'fill-opacity': 0.25, 'fill-outline-color': '#9e8352' }
      });
      map.addLayer({
        id: 'green-land', type: 'fill', source: 'world',
        filter: ['in', ['get', 'kind'], ['literal', ['forest', 'green']]],
        paint: {
          'fill-color': ['match', ['get', 'kind'], 'forest', '#315438', '#71834b'],
          'fill-opacity': ['match', ['get', 'kind'], 'forest', 0.72, 0.42],
          'fill-outline-color': '#28452d'
        }
      });
      map.addLayer({
        id: 'water-polygons', type: 'fill', source: 'world',
        filter: ['==', ['get', 'kind'], 'water'],
        paint: { 'fill-color': '#79aab2', 'fill-opacity': 0.82, 'fill-outline-color': '#315e67' }
      });
      map.addLayer({
        id: 'water-lines-shadow', type: 'line', source: 'world',
        filter: ['==', ['get', 'kind'], 'waterway'],
        paint: { 'line-color': '#315e67', 'line-width': ['+', roadWidth, 2], 'line-opacity': 0.55 }
      });
      map.addLayer({
        id: 'water-lines', type: 'line', source: 'world',
        filter: ['==', ['get', 'kind'], 'waterway'],
        paint: { 'line-color': '#88bbc3', 'line-width': roadWidth }
      });
      map.addLayer({
        id: 'road-casing', type: 'line', source: 'world',
        filter: ['==', ['get', 'kind'], 'road'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#49311e', 'line-width': ['+', roadWidth, 2.4], 'line-opacity': 0.75 }
      });
      map.addLayer({
        id: 'roads', type: 'line', source: 'world',
        filter: ['==', ['get', 'kind'], 'road'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': ['match', ['get', 'highway'],
            ['primary', 'secondary', 'tertiary'], '#d6b676',
            ['residential', 'living_street'], '#bd9961',
            '#9c7a4e'
          ],
          'line-width': roadWidth,
          'line-opacity': 0.96
        }
      });
      map.addLayer({
        id: 'buildings-shadow', type: 'fill', source: 'world',
        filter: ['==', ['get', 'kind'], 'building'],
        paint: { 'fill-color': '#5b3a23', 'fill-translate': [1.5, 1.5], 'fill-opacity': 0.65 }
      });
      map.addLayer({
        id: 'buildings', type: 'fill', source: 'world',
        filter: ['==', ['get', 'kind'], 'building'],
        paint: {
          'fill-color': ['match', ['get', 'building'],
            ['commercial', 'retail'], '#b36b43',
            ['church', 'cathedral', 'chapel'], '#a66c42',
            '#c08b4b'
          ],
          'fill-outline-color': '#5b3a23',
          'fill-opacity': 0.92
        }
      });
      map.addLayer({
        id: 'fantasy-icons', type: 'symbol', source: 'world',
        filter: ['all', ['has', 'fantasy_icon'], ['!=', ['get', 'fantasy_icon'], '']],
        minzoom: 15.2,
        layout: {
          'text-field': ['get', 'fantasy_icon'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 15, 12, 18, 20],
          'text-font': ['Open Sans Regular'],
          'text-allow-overlap': false
        },
        paint: { 'text-color': '#2f2519', 'text-halo-color': '#ead9ad', 'text-halo-width': 1.2 }
      });
      map.addLayer({
        id: 'labels', type: 'symbol', source: 'world',
        filter: ['all', ['has', 'label'], ['!=', ['get', 'label'], '']],
        minzoom: 15,
        layout: {
          'symbol-placement': 'point',
          'text-field': ['get', 'label'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 15, 10, 18, 14],
          'text-font': ['Open Sans Regular'],
          'text-offset': [0, 1.2],
          'text-anchor': 'top',
          'text-max-width': 12
        },
        paint: { 'text-color': '#382719', 'text-halo-color': '#ead9ad', 'text-halo-width': 1.5 }
      });
      map.addLayer({
        id: 'center-ring', type: 'circle', source: 'world',
        filter: ['==', ['get', 'kind'], 'center'],
        paint: {
          'circle-radius': 9,
          'circle-color': '#f0d47c',
          'circle-stroke-color': '#3f2a18',
          'circle-stroke-width': 3
        }
      });
    }

    function setMode(mode) {
      const fantasy = mode === 'fantasy';
      document.body.classList.toggle('fantasy', fantasy);
      map.setLayoutProperty('osm-reality', 'visibility', fantasy ? 'none' : 'visible');
      for (const layer of map.getStyle().layers) {
        if (layer.source === 'world') {
          map.setLayoutProperty(layer.id, 'visibility', fantasy ? 'visible' : 'none');
        }
      }
      document.querySelectorAll('[data-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === mode);
      });
    }

    document.querySelectorAll('[data-mode]').forEach(button => {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    });

    map.on('load', () => {
      addFantasyLayers();
      map.fitBounds(BOUNDS, { padding: 56, duration: 0 });
    });

    map.on('idle', () => {
      document.getElementById('status').classList.add('hidden');
      setTimeout(() => document.getElementById('status').remove(), 500);
    });

    map.on('error', event => {
      const message = event?.error?.message ?? 'Неизвестная ошибка загрузки карты';
      console.error(event.error ?? event);
      const status = document.getElementById('status');
      if (status) status.innerHTML = `<div class="error">${message}</div>`;
    });
  </script>
</body>
</html>
