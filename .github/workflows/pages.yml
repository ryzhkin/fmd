name: Build and deploy FMD demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and transform OpenStreetMap data
        run: |
          node scripts/build-data.mjs
          node scripts/enrich-buildings.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site/data _site/assets
          cp index.html _site/index.html
          cp houses.js _site/houses.js
          cp papyrus.js _site/papyrus.js
          cp assets/papyrus-texture.svg _site/assets/papyrus-texture.svg
          cp assets/house-square-topdown.webp _site/assets/house-square-topdown.webp
          cp assets/house-cottage-topdown.webp _site/assets/house-cottage-topdown.webp
          cp assets/house-long-topdown.webp _site/assets/house-long-topdown.webp
          cp assets/tree-deciduous-topdown.webp _site/assets/tree-deciduous-topdown.webp
          cp data/map.geojson _site/data/map.geojson
          sed -i 's#</body>#  <script src="./papyrus.js"></script>\n  <script src="./houses.js"></script>\n</body>#' _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
