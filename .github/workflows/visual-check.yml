name: Playwright mobile check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify data and TypeScript
        run: |
          npm run data:verify -- --region=sumy
          npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run mobile browser checks
        run: npm run test:e2e

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmd-iphone-screenshot-${{ github.run_attempt }}
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp -R test-results diagnostics/test-results || true
          cp -R playwright-report diagnostics/playwright-report || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fmd-playwright-failure-${{ github.run_attempt }}
          path: diagnostics
          if-no-files-found: warn
          retention-days: 3
